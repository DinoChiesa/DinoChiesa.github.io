<!doctype html>
<html lang="en">
  <head>
    <title>CORS Demonstrator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="css/main.css" />
    <script type="text/javascript" src="js/page.js"></script>
  </head>

  <body>
    <main class="page-container">
      <div class="card app-card">
        <header class="card-header">
          <span class="kicker">HTTP CORS TOOL</span>
          <h1 class="title">CORS Demonstrator</h1>
          <p class="subtitle">Interactively test and demonstrate Cross-Origin Resource Sharing (CORS) behavior and headers directly from this browser origin.</p>
        </header>

        <form role="form" id="form1" accept-charset="UTF-8">
          <div class="form-group">
            <div class="url-grid">
              <div>
                <label for="txt-baseurl" class="form-label">Base URL</label>
                <input
                  id="txt-baseurl"
                  name="txt-baseurl"
                  class="form-control txt"
                  placeholder="https://my-apigee.example.com"
                  spellcheck="false"
                  title="e.g. https://my-apigee.example.com"
                />
              </div>
              <div>
                <label for="txt-urlpath" class="form-label">URL Path</label>
                <input
                  id="txt-urlpath"
                  name="txt-urlpath"
                  class="form-control txt"
                  placeholder="/v1/endpoint"
                  spellcheck="false"
                  title="e.g. /cors-test/v1/ping"
                />
              </div>
            </div>
          </div>

          <div class="form-group">
            <div class="verb-grid">
              <div>
                <label for="sel-verb" class="form-label">HTTP Verb</label>
                <select class="form-select sel-verb" id="sel-verb">
                  <option value="GET">GET</option>
                  <option value="POST">POST</option>
                  <option value="PUT">PUT</option>
                  <option value="DELETE">DELETE</option>
                </select>
              </div>

              <div class="for-payload notshown">
                <label for="sel-contenttype" class="form-label">Content-Type</label>
                <select class="form-select sel-contenttype" id="sel-contenttype">
                  <option value="text/plain">text/plain</option>
                  <option value="application/x-www-form-urlencoded">application/x-www-form-urlencoded</option>
                  <option value="application/json">application/json</option>
                </select>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="ta-addlheaderlist" class="form-label">Additional Headers</label>
            <textarea
              rows="3"
              id="ta-addlheaderlist"
              class="form-control txt"
              placeholder="Header-Name: Value&#10;X-Requested-With: XMLHttpRequest"
              spellcheck="false"
            ></textarea>
          </div>

          <div class="form-group for-payload notshown">
            <label for="ta-body" class="form-label">Payload Body</label>
            <textarea
              rows="4"
              id="ta-body"
              class="form-control txt"
              placeholder='{"message": "Hello from CORS demonstrator"}'
              spellcheck="false"
            ></textarea>
          </div>

          <div class="actions-row">
            <button type="button" class="btn btn-primary" id="btn-send">
              Send Request
            </button>
            <button type="button" class="btn btn-secondary notshown" id="btn-clear">
              Clear Output
            </button>
          </div>
        </form>

        <div id="output" class="notshown"></div>
      </div>
    </main>
  </body>
</html>
